<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Mon Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #18181b;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .my {
            text-transform: uppercase;
            font-family: Impact, sans-serif;
            color: #00f2fe;
            line-height: 1;
            letter-spacing: 1px;
        }

        .nav-link {
            display: flex;
            gap: 25px;
        }

        .nav-link a {
            text-decoration: none;
            color: #a1a1aa;
            font-weight: 500;
            transition: color 0.3s ease;
            display: inline-block;
        }

        .nav-link a:hover,
        .nav-link a.active {
            color: #00f2fe;
        }

        .hero-section {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            padding: 60px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-img-container {
            width: 100%;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .hero-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease;
        }

        .hero-img-container:hover img {
            transform: scale(1.03);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background-color: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.2rem;
            color: #ffffff;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        h1 .highlight {
            color: #00f2fe;
        }

        .line {
            display: inline-block;
            width: 60px;
            height: 4px;
            background-color: #00f2fe;
            border-radius: 2px;
            vertical-align: middle;
            margin: 0 10px;
        }

        p {
            color: #a1a1aa;
            font-size: 1.05rem;
            margin-bottom: 30px;
            max-width: 480px;
        }

        .btn-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #121214;
            background-color: #00f2fe;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
        }

        .btn-cta:hover {
            background-color: #ffffff;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 868px) {
            .hero-section {
                grid-template-columns: 1fr;
                gap: 40px;
                text-align: center;
            }

            p {
                margin: 0 auto 30px auto;
            }

            .hero-img-container {
                height: 380px;
                order: -1;
            }

            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="my">my<br>portfolio</div>
        <div class="nav-link">
            <a href="index.html" class="active">Accueil</a>
            <a href="apropos.html">À propos</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="hero-section">
        <div class="hero-img-container">
            <img src="ma.jpg.png" alt="Photo de profil">
        </div>

        <div class="hero-content">
            <span class="badge">Développeur Software</span>
            <h1>Biedi <span class="line"></span><br><span class="highlight">Mathys Bryan</span></h1>
            <p>Bienvenue sur mon espace. Découvrez une sélection de mes projets récents en développement web, conçus avec passion pour allier design moderne, stratégie et performance.</p>
            <a href="apropos.html" class="btn-cta">Explorer mon profil</a>
        </div>
    </main>

</body>
</html>
