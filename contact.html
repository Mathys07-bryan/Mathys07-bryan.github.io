<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mon Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #18181b;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .my {
            text-transform: uppercase;
            font-family: Impact, sans-serif;
            color: #00f2fe;
            line-height: 1;
            letter-spacing: 1px;
        }

        .nav-link {
            display: flex;
            gap: 25px;
        }

        .nav-link a {
            text-decoration: none;
            color: #a1a1aa;
            font-weight: 500;
            transition: color 0.3s ease;
            display: inline-block;
        }

        .nav-link a:hover,
        .nav-link a.active {
            color: #00f2fe;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: #18181b;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background-color: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 2rem;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .txt {
            color: #a1a1aa;
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        .container-elmt {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .contact-card {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            background-color: #222226;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e1e1e6;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        a.contact-card:hover {
            border-color: rgba(0, 242, 254, 0.4);
            transform: translateY(-3px);
            background-color: #27272a;
            color: #00f2fe;
        }

        .icon {
            font-size: 1.2rem;
            color: #00f2fe;
            width: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="my">my<br>portfolio</div>
        <div class="nav-link">
            <a href="index.html">Accueil</a>
            <a href="apropos.html">À propos</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="container">
            <span class="badge">Discutons ensemble</span>
            <h1 class="header-title">Prendre contact</h1>
            <p class="txt">N'hésitez pas à me contacter pour échanger sur vos projets ou opportunités.</p>
            
            <div class="container-elmt">
                <a href="mailto:cresson717@gmail.com" class="contact-card">
                    <span class="icon">&#9993;</span>
                    <span>cresson717@gmail.com</span>
                </a>

                <a href="tel:+237622098715" class="contact-card">
                    <span class="icon">&#9742;</span>
                    <span>+237 622 098 715</span>
                </a>

                <div class="contact-card">
                    <span class="icon">&#128205;</span>
                    <span>Yaoundé, Cameroun</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
